<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Burger House — Sem meio-termo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;800;900&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink: #0F0D0C;
    --ink-2: #1A1614;
    --flame: #FF5A1F;
    --cheese: #FFC93C;
    --maroon: #3D0F12;
    --paper: #F7F3EE;
    --line: rgba(247,243,238,0.12);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--ink);
    color:var(--paper);
    font-family:'Manrope', sans-serif;
    overflow-x:hidden;
  }
  h1,h2,h3,.display{
    font-family:'Unbounded', sans-serif;
    line-height:1;
    letter-spacing:-0.02em;
  }
  a{color:inherit; text-decoration:none;}
